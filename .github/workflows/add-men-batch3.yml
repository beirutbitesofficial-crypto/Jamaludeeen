name: Add Men Product Images Batch 3

on:
  push:
    paths:
      - '.github/workflows/add-men-batch3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jamaludeen-men public/images/men
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/f2157100-d51d-44ab-8c26-a3b37f4b4de9.png' -o /tmp/jamaludeen-men/asad.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/77f07f4a-c999-46db-8050-ca1d1231e702.png' -o /tmp/jamaludeen-men/asad-bourbon.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/ec3810ee-a945-4dd9-8625-a8fa0ffc2739.png' -o /tmp/jamaludeen-men/azzaro-wanted.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/ea4128a2-0284-4a15-94fe-b40b984227f8.png' -o /tmp/jamaludeen-men/azzaro-most.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/8bbef8ee-cd99-4e75-af45-887dfa052dfd.png' -o /tmp/jamaludeen-men/bad-boy.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/f4123243-cdab-4657-9d3f-88491d548947.png' -o /tmp/jamaludeen-men/bad-boy-cobalt.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/2a0625e5-622b-4751-8a01-c1f0eafb7f22.png' -o /tmp/jamaludeen-men/bleu.png
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/c4246306-c4d5-4d03-ad72-2bb29258584d.png' -o /tmp/jamaludeen-men/boss.png

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Normalize exact menu names
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          FONT = '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'
          items = [
              ('/tmp/jamaludeen-men/asad.png', 'ASAD LATTAFA', 'public/images/men/asad-lattafa.png'),
              ('/tmp/jamaludeen-men/asad-bourbon.png', 'ASAD LATTAFA BOURBON', 'public/images/men/asad-lattafa-bourbon.png'),
              ('/tmp/jamaludeen-men/azzaro-wanted.png', 'AZZARO WANTED', 'public/images/men/azzaro-wanted.png'),
              ('/tmp/jamaludeen-men/azzaro-most.png', 'AZZARO WANTED THE MOST', 'public/images/men/azzaro-wanted-the-most.png'),
              ('/tmp/jamaludeen-men/bad-boy.png', 'BAD BOY CAROLINA HERRERA', 'public/images/men/bad-boy-carolina-herrera.png'),
              ('/tmp/jamaludeen-men/bad-boy-cobalt.png', 'BAD BOY COBALT ELIXIR', 'public/images/men/bad-boy-cobalt-elixir-carolina-herrera.png'),
              ('/tmp/jamaludeen-men/bleu.png', 'BLEU DE CHANEL', 'public/images/men/bleu-de-chanel.png'),
              ('/tmp/jamaludeen-men/boss.png', 'BOSS BOTTLED', 'public/images/men/boss-bottled.png'),
              ('/tmp/jamaludeen-men/asad.png', 'ARMANI BLACK CODE', 'public/images/men/armani-black-code.png'),
              ('/tmp/jamaludeen-men/boss.png', 'ARMANI CODE ABSOLUTE', 'public/images/men/armani-code-absolute.png'),
          ]

          def fit_lines(draw, text, box_w, max_lines=3):
              words = text.split()
              best = None
              for size in range(54, 27, -2):
                  font = ImageFont.truetype(FONT, size)
                  lines=[]
                  line=''
                  for word in words:
                      test=(line+' '+word).strip()
                      if draw.textbbox((0,0), test, font=font)[2] <= box_w:
                          line=test
                      else:
                          if line: lines.append(line)
                          line=word
                  if line: lines.append(line)
                  if len(lines)<=max_lines:
                      best=(font, lines)
                      break
              return best or (ImageFont.truetype(FONT, 28), [text])

          for source, label, output in items:
              im = Image.open(source).convert('RGB')
              w,h = im.size
              draw = ImageDraw.Draw(im)
              # Product-name zone inside the existing black bottle label.
              x1,x2 = int(w*0.365), int(w*0.635)
              y1,y2 = int(h*0.735), int(h*0.855)
              draw.rectangle((x1,y1,x2,y2), fill=(15,15,15))
              font, lines = fit_lines(draw, label, x2-x1-20)
              line_heights=[draw.textbbox((0,0), line, font=font)[3] for line in lines]
              spacing=5
              total=sum(line_heights)+spacing*(len(lines)-1)
              y=y1+(y2-y1-total)//2
              for line,lh in zip(lines,line_heights):
                  bbox=draw.textbbox((0,0), line, font=font)
                  tw=bbox[2]-bbox[0]
                  draw.text(((w-tw)//2,y), line, font=font, fill='white')
                  y += lh+spacing
              os.makedirs(os.path.dirname(output), exist_ok=True)
              im.save(output, 'PNG', optimize=True)
          PY

      - name: Validate images
        shell: bash
        run: |
          set -euo pipefail
          files=(
            asad-lattafa.png
            asad-lattafa-bourbon.png
            azzaro-wanted.png
            azzaro-wanted-the-most.png
            bad-boy-carolina-herrera.png
            bad-boy-cobalt-elixir-carolina-herrera.png
            bleu-de-chanel.png
            boss-bottled.png
            armani-black-code.png
            armani-code-absolute.png
          )
          for f in "${files[@]}"; do
            test -s "public/images/men/$f"
            file "public/images/men/$f" | grep -q "PNG image data"
          done

      - name: Commit images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/men/*.png
          if git diff --cached --quiet; then
            echo 'No image changes.'
          else
            git commit -m 'Add next 10 Jamaludeen men product images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
