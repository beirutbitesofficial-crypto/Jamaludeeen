name: Repair Men Product Images

on:
  push:
    paths:
      - '.github/workflows/repair-men-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download original generated PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/men
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144829_e3bac776-cfc9-4317-bb9c-661c8ab577d9.png' -o 'public/images/men/a-men-fantasm-mugler.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144828_e0c0f087-1231-448c-b811-21ad86420f01.png' -o 'public/images/men/adidas-game-spirit.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144829_36236f42-7115-4c64-ad17-594cdd274698.png' -o 'public/images/men/adidas-sport.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144828_2bf36611-3a97-4d7a-aadf-5e68db6da7b5.png' -o 'public/images/men/ajwad-lattafa.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144828_adaa98e7-0337-443f-9ab9-05eb1b77c9d2.png' -o 'public/images/men/akira.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144830_1b0dcc22-2c18-422d-bffc-065054aa22af.png' -o 'public/images/men/al-haybe.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144843_e9537383-4aae-40fe-a8ca-808f982e44a9.png' -o 'public/images/men/allure-homme-sport.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144844_9fa60a2b-7de6-47eb-b862-b856c0c383fd.png' -o 'public/images/men/althair-de-marly.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144842_fc3cc8c8-2509-4423-bf13-c02c3c064931.png' -o 'public/images/men/amarige.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_144844_e0b0497b-741a-40ac-9646-215a7a423b77.png' -o 'public/images/men/angel.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151145_7bee0ab1-c4e4-44c7-927f-9c7457cba853.png' -o 'public/images/men/antonio-banderas.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151144_00aeaf6e-b840-4acb-8565-6f9e349e636f.png' -o 'public/images/men/antonio-banderas-the-golden-secret.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151143_3a1a4a21-aaba-4c9f-9301-4b573be57c86.png' -o 'public/images/men/aqua-bvlgari.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151144_26cadc52-d719-47c6-bc9d-a162841e4877.png' -o 'public/images/men/acqua-di-gio.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151144_5dd4a369-e98a-424c-a4a9-8476f954b56e.png' -o 'public/images/men/acqua-di-gio-giorgio-armani.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151144_9ad6f05b-6cca-4bea-981a-e3159b1e93c3.png' -o 'public/images/men/acqua-di-gio-profondo.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151225_a8cca3b5-e73f-419f-92fd-3a7c269111ab.png' -o 'public/images/men/acqua-di-gio-profumo.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151157_91bb196b-19d6-4abc-bd54-504326dbe189.png' -o 'public/images/men/acqua-di-parma-blue.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151156_5e3969d5-7954-47c2-b2c7-23d309ab740f.png' -o 'public/images/men/aqua-silva.png'
          curl -L --fail --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3JahsNfdJiL2hQxRHRNOGejlAWc/hf_20260921_151226_8ff5ab89-7379-4229-a735-8dfc21bf8870.png' -o 'public/images/men/aramis.png'

      - name: Validate images
        shell: bash
        run: |
          set -euo pipefail
          for f in public/images/men/*.png; do
            test -s "$f"
            file "$f" | grep -q "PNG image data"
          done

      - name: Commit repaired images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/men/*.png
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Repair first 20 men product images with complete PNG files'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
